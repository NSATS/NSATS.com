<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Stages in the regeneration task</title>
  <desc id="d">An input passes through a swap gate to an output. The gate’s retained input and output information goes to an external processor, which produces a regenerated input for a subsequent calculation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202428"/>
    </marker>
  </defs>
  <g font-family="NSATS Sans, IBM Plex Sans, Arial, sans-serif" font-size="15" fill="#202428" text-anchor="middle">
    <!-- Row 1: input → swap gate → output -->
    <rect x="40" y="60" width="150" height="56" fill="#ffffff" stroke="#202428" stroke-width="1.5"/>
    <text x="115" y="94">Input</text>

    <line x1="190" y1="88" x2="300" y2="88" stroke="#202428" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="300" y="60" width="200" height="56" fill="#ffffff" stroke="#202428" stroke-width="1.5"/>
    <text x="400" y="94">Swap gate</text>

    <line x1="500" y1="88" x2="610" y2="88" stroke="#202428" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="610" y="60" width="150" height="56" fill="#ffffff" stroke="#202428" stroke-width="1.5"/>
    <text x="685" y="94">Output</text>

    <!-- Retained information: gate → external processor (dashed) -->
    <line x1="400" y1="116" x2="400" y2="190" stroke="#202428" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <text x="400" y="156" font-size="13" text-anchor="start" transform="translate(8 0)">retained input and output information</text>

    <!-- Row 2: external processor → regenerated input → subsequent calculation -->
    <rect x="300" y="190" width="200" height="56" fill="#ffffff" stroke="#202428" stroke-width="1.5"/>
    <text x="400" y="224">External processor</text>

    <line x1="500" y1="218" x2="610" y2="218" stroke="#202428" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="555" y="208" font-size="13">regenerates</text>

    <rect x="610" y="190" width="150" height="56" fill="#ffffff" stroke="#202428" stroke-width="1.5"/>
    <text x="685" y="217">Regenerated</text>
    <text x="685" y="235">input</text>

    <line x1="685" y1="246" x2="685" y2="280" stroke="#202428" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="685" y="296" font-size="13">to subsequent calculation</text>
  </g>
</svg>
