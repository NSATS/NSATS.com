<svg xmlns:xlink="http://www.w3.org/1999/xlink" width="921.6pt" height="468pt" viewBox="0 0 921.6 468" xmlns="http://www.w3.org/2000/svg" version="1.1" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Cumulative compression by round — synthetic sample — not a measurement</title>
<desc id="figure-description">The three lines illustrate how to read successive cumulative-percentage entries in the synthetic round log; they are indistinguishable at this scale because every test’s per-rotation figures are drawn from the same sample band, and each stops at that test’s last round (test 1: 6 rounds, test 11: 3 rounds, test 12: 10 rounds). No fitted trend or extrapolation is added.</desc>
