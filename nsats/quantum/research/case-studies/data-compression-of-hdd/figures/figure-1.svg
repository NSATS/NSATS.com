<title id="figure-title">Paired sizes by test — synthetic sample — not a measurement</title>
<desc id="figure-description">Paired bars illustrate the original and modelled stored size for each synthetic test. The logarithmic axis does not start at zero; bar heights are not a direct percentage scale.</desc>
