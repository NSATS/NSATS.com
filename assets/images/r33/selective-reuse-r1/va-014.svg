<svg aria-labelledby="diagram-04-title diagram-04-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="330" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 330" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-04-title">The quantum-classical bus</title><desc id="diagram-04-desc">A box labelled “Device” encloses boxes labelled “Processor” and “Memory”. Between them, a line labelled “Quantum-classical bus” carries arrows in both directions. The processor-to-memory arrow reads “Requests”; the return arrow reads “Data”. The line’s label reads “Carries electrical signals with more than two states”. Both component boxes and their connecting arrows sit inside the device boundary.</desc><defs><marker id="diagram-04-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-04-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="none" height="270" rx="6" stroke="var(--muted,#525252)" stroke-dasharray="8 6" stroke-width="1.5" width="480" x="20" y="40"></rect><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="30" y="32"><tspan dy="0" x="30">Device</tspan></text><rect fill="var(--tint,#e8f7fb)" height="90" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="130" x="40" y="110"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="105.0" y="160.6"><tspan dy="0" x="105.0">Processor</tspan></text><rect fill="var(--tint,#e8f7fb)" height="90" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="130" x="350" y="110"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="415.0" y="160.6"><tspan dy="0" x="415.0">Memory</tspan></text><line stroke="var(--ink,#161616)" stroke-width="6" x1="170" x2="350" y1="155" y2="155"></line><line marker-end="url(#diagram-04-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="185" x2="335" y1="128" y2="128"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="260.0" y="120"><tspan dy="0" x="260.0">Requests</tspan></text><line marker-end="url(#diagram-04-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="335" x2="185" y1="182" y2="182"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="260.0" y="204"><tspan dy="0" x="260.0">Data</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="260" y="248"><tspan dy="0" x="260">Quantum-classical bus</tspan><tspan dy="20" x="260">Carries electrical signals</tspan><tspan dy="20" x="260">with more than two states</tspan></text></svg>
