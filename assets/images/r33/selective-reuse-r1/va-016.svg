<svg aria-labelledby="diagram-06-title diagram-06-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="640" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 640" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-06-title">The end-to-end network path</title><desc id="diagram-06-desc">Arrows connect “Sending host”, “Sending quantum-classical card”, “Ordinary routers — no NSATS chip”, “Receiving quantum-classical card” and “Receiving host”. Each card box is labelled “Contains quantum-classical chip”. At the receiving host, a completion label reads “The receiving application can use the information”. Along the complete path, labels name “Channel capacity”, “Transmitted-bit rate”, “Original-data throughput” and “Elapsed time to usable data”.</desc><defs><marker id="diagram-06-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-06-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="var(--tint,#e8f7fb)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="300" x="180" y="20"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="330.0" y="57.6"><tspan dy="0" x="330.0">Sending host</tspan></text><line marker-end="url(#diagram-06-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="330" x2="330" y1="84" y2="118"></line><rect fill="var(--paper,#fff)" height="96" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="300" x="180" y="120"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="330.0" y="152.6"><tspan dy="0" x="330.0">Sending</tspan><tspan dy="21" x="330.0">quantum-classical card</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="330.0" y="194.6"><tspan dy="0" x="330.0">Contains quantum-classical chip</tspan></text><line marker-end="url(#diagram-06-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="330" x2="330" y1="216" y2="250"></line><rect fill="var(--layer,#f4f4f4)" height="70" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="300" x="180" y="252"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="330.0" y="282.1"><tspan dy="0" x="330.0">Ordinary routers —</tspan><tspan dy="21" x="330.0">no NSATS chip</tspan></text><line marker-end="url(#diagram-06-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="330" x2="330" y1="322" y2="356"></line><rect fill="var(--paper,#fff)" height="96" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="300" x="180" y="358"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="330.0" y="390.6"><tspan dy="0" x="330.0">Receiving</tspan><tspan dy="21" x="330.0">quantum-classical card</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="330.0" y="432.6"><tspan dy="0" x="330.0">Contains quantum-classical chip</tspan></text><line marker-end="url(#diagram-06-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="330" x2="330" y1="454" y2="488"></line><rect fill="var(--tint,#e8f7fb)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="300" x="180" y="490"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="330.0" y="527.6"><tspan dy="0" x="330.0">Receiving host</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="end" x="168" y="106"><tspan dy="0" x="168">Channel capacity</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="end" x="168" y="238"><tspan dy="0" x="168">Transmitted-bit rate</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="end" x="168" y="344"><tspan dy="0" x="168">Original-data</tspan><tspan dy="20" x="168">throughput</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="end" x="168" y="476"><tspan dy="0" x="168">Elapsed time to</tspan><tspan dy="20" x="168">usable data</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="330" y="592"><tspan dy="0" x="330">The receiving application</tspan><tspan dy="20" x="330">can use the information</tspan></text></svg>
