<svg aria-labelledby="diagram-05-title diagram-05-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="700" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 700" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-05-title">Temporal Compression stages</title><desc id="diagram-05-desc">An “Application” box leads through “Received — illustrated acceptance” and “Stored — illustrated storage complete” to “Retrieval”. An arrow continues to “Check intact retrieval against original”. A “Drive” box carries separate labels: “Physical capacity — storage resource” and “Effective capacity — original data retained and returned intact”. The stage boxes follow the illustrated sequence; the capacity labels describe distinct quantities on the drive.</desc><defs><marker id="diagram-05-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-05-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="var(--tint,#e8f7fb)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="260" x="130" y="20"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="57.6"><tspan dy="0" x="260.0">Application</tspan></text><line marker-end="url(#diagram-05-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="84" y2="118"></line><rect fill="var(--paper,#fff)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="260" x="130" y="120"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="260.0" y="147.1"><tspan dy="0" x="260.0">Received —</tspan><tspan dy="21" x="260.0">illustrated acceptance</tspan></text><line marker-end="url(#diagram-05-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="184" y2="218"></line><rect fill="var(--paper,#fff)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="260" x="130" y="220"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="260.0" y="247.1"><tspan dy="0" x="260.0">Stored —</tspan><tspan dy="21" x="260.0">illustrated storage complete</tspan></text><line marker-end="url(#diagram-05-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="284" y2="318"></line><rect fill="var(--paper,#fff)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="260" x="130" y="320"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="357.6"><tspan dy="0" x="260.0">Retrieval</tspan></text><line marker-end="url(#diagram-05-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="384" y2="418"></line><rect fill="var(--paper,#fff)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="260" x="130" y="420"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="260.0" y="447.1"><tspan dy="0" x="260.0">Check intact retrieval</tspan><tspan dy="21" x="260.0">against original</tspan></text><rect fill="none" height="140" rx="6" stroke="var(--muted,#525252)" stroke-dasharray="8 6" stroke-width="1.5" width="400" x="60" y="540"></rect><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="70" y="532"><tspan dy="0" x="70">Drive</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="260" y="578"><tspan dy="0" x="260">Physical capacity — storage resource</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="260" y="630"><tspan dy="0" x="260">Effective capacity — original data</tspan><tspan dy="20" x="260">retained and returned intact</tspan></text></svg>
