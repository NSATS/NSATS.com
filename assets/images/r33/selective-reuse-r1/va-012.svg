<svg aria-labelledby="diagram-02-title diagram-02-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="380" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 380" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-02-title">A computing operation at the application boundary</title><desc id="diagram-02-desc">An “Application” box sends an arrow labelled “Inputs” across a system boundary to one “Licensed function” box. An arrow labelled “Results” returns to the application. Inside the boundary, separate resource boxes read “Retained storage”, “Working RAM”, “Retained gate information” and “Processor’s working memory”, in that order. The resource boxes sit beside the function box, separately labelled within the same boundary.</desc><defs><marker id="diagram-02-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-02-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="var(--tint,#e8f7fb)" height="80" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="105" x="10" y="150"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="600" text-anchor="middle" x="62.5" y="195.25"><tspan dy="0" x="62.5">Application</tspan></text><rect fill="none" height="330" rx="6" stroke="var(--muted,#525252)" stroke-dasharray="8 6" stroke-width="1.5" width="310" x="200" y="30"></rect><line marker-end="url(#diagram-02-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="115" x2="228" y1="175" y2="175"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="160" y="166"><tspan dy="0" x="160">Inputs</tspan></text><line marker-end="url(#diagram-02-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="230" x2="117" y1="205" y2="205"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="160" y="226"><tspan dy="0" x="160">Results</tspan></text><rect fill="var(--paper,#fff)" height="80" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="115" x="230" y="150"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="600" text-anchor="middle" x="287.5" y="185.25"><tspan dy="0" x="287.5">Licensed</tspan><tspan dy="20" x="287.5">function</tspan></text><rect fill="var(--layer,#f4f4f4)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="140" x="355" y="45"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="425.0" y="82.25"><tspan dy="0" x="425.0">Retained storage</tspan></text><rect fill="var(--layer,#f4f4f4)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="140" x="355" y="123"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="425.0" y="160.25"><tspan dy="0" x="425.0">Working RAM</tspan></text><rect fill="var(--layer,#f4f4f4)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="140" x="355" y="201"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="425.0" y="228.25"><tspan dy="0" x="425.0">Retained gate</tspan><tspan dy="20" x="425.0">information</tspan></text><rect fill="var(--layer,#f4f4f4)" height="64" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="140" x="355" y="279"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="425.0" y="306.25"><tspan dy="0" x="425.0">Processor’s</tspan><tspan dy="20" x="425.0">working memory</tspan></text></svg>
