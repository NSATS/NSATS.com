<svg aria-labelledby="diagram-01-title diagram-01-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="560" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 560" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-01-title">Where a licence sits</title><desc id="diagram-01-desc">An arrow leads from “NSATS licence” to “Licensee’s own design and build”, then to “Licensee’s system”. The design box lists chipset, controller, drive, memory, network card and device. Inside the system box, “Existing drives and RAM — ordinary classical storage” connects through “Licensee-added chipset or controller”. Arrows between these boxes identify participation through that added component in the licensee’s system.</desc><defs><marker id="diagram-01-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-01-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="var(--tint,#e8f7fb)" height="60" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="200" x="160" y="20"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="55.6"><tspan dy="0" x="260.0">NSATS licence</tspan></text><line marker-end="url(#diagram-01-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="80" y2="118"></line><rect fill="var(--paper,#fff)" height="110" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="300" x="110" y="120"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="149.1"><tspan dy="0" x="260.0">Licensee’s own</tspan><tspan dy="21" x="260.0">design and build</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="260.0" y="191.1"><tspan dy="0" x="260.0">chipset · controller · drive</tspan><tspan dy="20" x="260.0">memory · network card · device</tspan></text><line marker-end="url(#diagram-01-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="230" y2="288"></line><rect fill="none" height="250" rx="6" stroke="var(--muted,#525252)" stroke-dasharray="8 6" stroke-width="1.5" width="440" x="40" y="290"></rect><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="50" y="282"><tspan dy="0" x="50">Licensee’s system</tspan></text><rect fill="var(--layer,#f4f4f4)" height="80" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="380" x="70" y="310"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="260.0" y="345.1"><tspan dy="0" x="260.0">Existing drives and RAM —</tspan><tspan dy="21" x="260.0">ordinary classical storage</tspan></text><line marker-end="url(#diagram-01-arrow-end)" marker-start="url(#diagram-01-arrow-start)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="390" y2="438"></line><rect fill="var(--tint,#e8f7fb)" height="80" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="380" x="70" y="440"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="400" text-anchor="middle" x="260.0" y="475.1"><tspan dy="0" x="260.0">Licensee-added</tspan><tspan dy="21" x="260.0">chipset or controller</tspan></text></svg>
