<svg aria-labelledby="diagram-07-title diagram-07-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="640" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 640" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-07-title">A reference configuration</title><desc id="diagram-07-desc">A “Task” box points to “Licensed function”, linked to “Surrounding components” by arrows labelled “Requests” and “Results”. A boundary labelled “Licensee designs and builds” separates added components from “Existing components — continuing roles”. Beside it, instance labels read “Storage (temporal drive)”, “Working memory (RAM)”, “One component for storage and working memory”, “Networking (paired network cards)” and “Security”, grouped under “Reference configurations”.</desc><defs><marker id="diagram-07-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-07-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="var(--tint,#e8f7fb)" height="70" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="90" x="20" y="65"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="65.0" y="105.6"><tspan dy="0" x="65.0">Task</tspan></text><rect fill="none" height="260" rx="6" stroke="var(--muted,#525252)" stroke-dasharray="8 6" stroke-width="1.5" width="300" x="140" y="40"></rect><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="150" y="32"><tspan dy="0" x="150">Licensee designs and builds</tspan></text><line marker-end="url(#diagram-07-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="110" x2="173" y1="100" y2="100"></line><rect fill="var(--paper,#fff)" height="70" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="230" x="175" y="65"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="290.0" y="105.6"><tspan dy="0" x="290.0">Licensed function</tspan></text><line marker-end="url(#diagram-07-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="240" x2="240" y1="135" y2="198"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="end" x="230" y="172"><tspan dy="0" x="230">Requests</tspan></text><line marker-end="url(#diagram-07-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="340" x2="340" y1="200" y2="137"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="350" y="172"><tspan dy="0" x="350">Results</tspan></text><rect fill="var(--paper,#fff)" height="70" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="230" x="175" y="200"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="290.0" y="240.25"><tspan dy="0" x="290.0">Surrounding components</tspan></text><rect fill="var(--layer,#f4f4f4)" height="60" rx="4" stroke="var(--muted,#525252)" stroke-width="1.5" width="300" x="140" y="330"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="290.0" y="365.25"><tspan dy="0" x="290.0">Existing components — continuing roles</tspan></text><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="start" x="20" y="440"><tspan dy="0" x="20">Reference configurations</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="start" x="20" y="475"><tspan dy="0" x="20">Storage (temporal drive)</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="start" x="20" y="507"><tspan dy="0" x="20">Working memory (RAM)</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="start" x="20" y="539"><tspan dy="0" x="20">One component for storage and working memory</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="start" x="20" y="571"><tspan dy="0" x="20">Networking (paired network cards)</tspan></text><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="start" x="20" y="603"><tspan dy="0" x="20">Security</tspan></text></svg>
