<svg aria-labelledby="diagram-03-title diagram-03-desc" font-family="var(--font-sans,'IBM Plex Sans','Helvetica Neue',Arial,sans-serif)" height="600" role="img" style="max-width:100%;height:auto;background:var(--paper,#fff)" viewBox="0 0 520 600" width="520" xmlns="http://www.w3.org/2000/svg"><title id="diagram-03-title">Processor-assisted, semi-reversible computing</title><desc id="diagram-03-desc">Inside a boundary labelled “Component-level, limited reversibility”, a “Swap gates” box reads “Retain input and output information”. An “External processor” box sits outside that boundary, joined to the gates by a two-headed arrow. From the processor, an arrow labelled “Regenerated earlier inputs” reaches “Later calculation”. A separate box outside the component boundary reads “Full reversibility across the complete system — continuing research”.</desc><defs><marker id="diagram-03-arrow-end" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="9" refY="5"><path d="M0,0 L10,5 L0,10 z" fill="var(--action,#006b85)"></path></marker><marker id="diagram-03-arrow-start" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="1" refY="5"><path d="M10,0 L0,5 L10,10 z" fill="var(--action,#006b85)"></path></marker></defs><rect fill="none" height="140" rx="6" stroke="var(--muted,#525252)" stroke-dasharray="8 6" stroke-width="1.5" width="340" x="90" y="40"></rect><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="100" y="32"><tspan dy="0" x="100">Component-level, limited reversibility</tspan></text><rect fill="var(--paper,#fff)" height="90" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="280" x="120" y="65"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="105.1"><tspan dy="0" x="260.0">Swap gates</tspan></text><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="middle" x="260.0" y="126.1"><tspan dy="0" x="260.0">Retain input and output information</tspan></text><line marker-end="url(#diagram-03-arrow-end)" marker-start="url(#diagram-03-arrow-start)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="155" y2="218"></line><rect fill="var(--tint,#e8f7fb)" height="70" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="280" x="120" y="220"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="260.6"><tspan dy="0" x="260.0">External processor</tspan></text><line marker-end="url(#diagram-03-arrow-end)" stroke="var(--action,#006b85)" stroke-width="2" x1="260" x2="260" y1="290" y2="358"></line><text fill="var(--muted,#525252)" font-size="15" font-weight="400" text-anchor="start" x="270" y="330"><tspan dy="0" x="270">Regenerated earlier inputs</tspan></text><rect fill="var(--paper,#fff)" height="70" rx="4" stroke="var(--ink,#161616)" stroke-width="1.5" width="280" x="120" y="360"></rect><text fill="var(--ink,#161616)" font-size="16" font-weight="600" text-anchor="middle" x="260.0" y="400.6"><tspan dy="0" x="260.0">Later calculation</tspan></text><rect fill="var(--layer,#f4f4f4)" height="90" rx="4" stroke="var(--muted,#525252)" stroke-dasharray="6 5" stroke-width="1.5" width="440" x="40" y="480"></rect><text fill="var(--ink,#161616)" font-size="15" font-weight="400" text-anchor="middle" x="260.0" y="520.25"><tspan dy="0" x="260.0">Full reversibility across the</tspan><tspan dy="20" x="260.0">complete system — continuing research</tspan></text></svg>
